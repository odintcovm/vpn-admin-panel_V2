services:
  api:
    build: ./apps/api
    env_file:
      - .env
    environment:
      - APP_PROVIDER=${APP_PROVIDER:-mock}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data.db}
      - API_TOKEN=${API_TOKEN:-admin-token}
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    restart: unless-stopped

  web:
    build: ./apps/web
    env_file:
      - .env
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
      - VITE_API_TOKEN=${VITE_API_TOKEN:-admin-token}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

volumes:
  web_node_modules:
